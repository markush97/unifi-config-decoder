appId: com.markush97.unifi-config-decoder
productName: UniFi Config Decoder
directories:
  output: dist-electron-packed
# Disable signing completely - no valid certificate available
forceCodeSigning: false
afterSign: null
afterAllArtifactBuild: null
cscKeyPassword: null
cscLink: null
files:
  - dist/**/*
  - dist-electron/**/*
  - node_modules/**/*
extraResources:
  - from: dist
    to: app/dist

linux:
  target:
    - target: deb
      arch:
        - x64
        - arm64
    - target: AppImage
      arch:
        - x64
        - arm64
    - target: tar.gz
      arch:
        - x64
        - arm64
  category: Network
  description: Decrypt and analyze UniFi backup files

win:
  target:
    - target: nsis
      arch:
        - x64
        - ia32
    - target: portable
      arch:
        - x64
        - ia32
  signAndEditExecutable: false
  signDlls: false

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  category: public.app-category.developer-tools
  identity: null
  sign: null

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

# Additional signing disables
buildDependenciesFromSource: false
nodeGypRebuild: false
